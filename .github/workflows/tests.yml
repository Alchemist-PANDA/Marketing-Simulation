name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install linters
      run: python -m pip install --upgrade pip ruff black
    # Scoped to the modules hardened/added in the refactor. Ruff is expanded to
    # more of the tree as legacy files are cleaned up (tracked in CHANGELOG).
    - name: Ruff (new/hardened modules)
      run: ruff check src/core/logging_config.py src/core/validation.py src/core/health.py
                     src/ai/synth_data.py src/ai/feature_extractor.py
                     src/ai/ensemble_predictor.py src/ai/train_models.py
                     tests/test_validation.py tests/test_ml_pipeline.py
    - name: Black (advisory)
      run: black --check . || true

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run fast unit tests
      run: pytest tests/test_validation.py tests/test_ml_pipeline.py
